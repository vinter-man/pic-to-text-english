[project]
name = "pic2text"
version = "0.2.0"
description = "Turn a folder of screenshots into a Markdown checklist with offline OCR."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serhii Vinterman" }]
requires-python = ">=3.11"
dependencies = [
    "onnxruntime>=1.20",
    "rapidocr>=3.10,<4",
]
keywords = ["ocr", "screenshots", "markdown", "cli", "language-learning"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Markup :: Markdown",
]

[project.urls]
Repository = "https://github.com/vinter-man/pic-to-text-english"

[project.scripts]
pic2text = "pic2text.cli:main"

[dependency-groups]
dev = [
    "pillow>=11",
    "pytest>=8",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = ["/demo", "/docs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ocr: runs the real OCR model (slower, ~1s per image)"]
